name: Bootstrap MusicScale Live repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: musicscale-live-bootstrap-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect completed migration
        id: migration
        shell: bash
        run: |
          if [[ -f .migration-complete ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone canonical Live bootstrap
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          git clone --depth 1 --branch live/foundation-bootstrap \
            https://github.com/prdanielcunha/musicscale.git \
            /tmp/musicscale-source

      - name: Import Live subtree at repository root
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/musicscale-source/musicscale-live-bootstrap/ \
            "$GITHUB_WORKSPACE/"

      - name: Public-repository secret guard
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          forbidden_files="$(find . -type f \
            \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.p12' -o -name '*.pfx' -o -name '*service-account*.json' -o -name '*serviceAccount*.json' \) \
            -not -path './.git/*' -print)"

          if [[ -n "$forbidden_files" ]]; then
            echo "::error::Public-repository guard found forbidden credential-like files:"
            echo "$forbidden_files"
            exit 1
          fi

          if grep -RIEq \
            --exclude-dir=.git \
            --exclude='bootstrap-import.yml' \
            '(-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|sk-(proj-)?[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|"private_key"[[:space:]]*:)' \
            .; then
            echo "::error::Public-repository guard found credential-like material."
            exit 1
          fi

      - name: Record migration provenance
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          cat > .migration-complete <<'EOF'
          Source repository: prdanielcunha/musicscale
          Source branch: live/foundation-bootstrap
          Source subtree: musicscale-live-bootstrap/
          Target repository: prdanielcunha/musicscale-live
          Imported as repository root.
          EOF

      - name: Commit imported repository
        if: steps.migration.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "MusicScale Live Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: import canonical MusicScale Live bootstrap"
          git push origin HEAD:main
