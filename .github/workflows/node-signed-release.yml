name: Signed MusicScale Live Node release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: musicscale-live-signed-release
  cancel-in-progress: false

jobs:
  windows:
    name: Windows signed installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.MUSICSCALE_LIVE_WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.MUSICSCALE_LIVE_WINDOWS_CERT_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require Windows signing credentials
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64)) {
            throw "MUSICSCALE_LIVE_WINDOWS_CERT_PFX_BASE64 is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            throw "MUSICSCALE_LIVE_WINDOWS_CERT_PASSWORD is required."
          }

      - name: Install and certify source
        run: |
          npm install --no-audit --no-fund
          npm run check:brand
          npm run check:ui
          npm run typecheck
          npm test

      - name: Build PWA and Node executable
        run: |
          npm run build --workspace=@millionsnest/live-web
          npm run package:sea --workspace=@millionsnest/live-node

      - name: Stage and sign Windows Node
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "musicscale-live-signed"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $out "web") | Out-Null
          Copy-Item "packages/live-node/dist/MusicScaleLiveNode.exe" (Join-Path $out "MusicScaleLiveNode.exe") -Force
          Copy-Item "apps/live/dist/*" (Join-Path $out "web") -Recurse -Force
          Copy-Item "distribution/README-INSTALL.md" (Join-Path $out "README-INSTALL.md") -Force

          $cert = Join-Path $env:RUNNER_TEMP "musicscale-live-signing.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw "signtool.exe was not found." }

          & $signtool sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $cert /p $env:WINDOWS_CERT_PASSWORD (Join-Path $out "MusicScaleLiveNode.exe")
          if ($LASTEXITCODE -ne 0) { throw "Node Authenticode signing failed." }

          "PACKAGE_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_PATH=$cert" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build and sign one-click installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DSourceDir=$env:PACKAGE_DIR" "/DOutputDir=$env:PACKAGE_DIR" "/DAppVersion=$env:RELEASE_VERSION" "distribution/windows/MusicScaleLiveNode.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

          $setup = Join-Path $env:PACKAGE_DIR "MusicScaleLiveSetup.exe"
          & $env:SIGNTOOL sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $env:CERT_PATH /p $env:WINDOWS_CERT_PASSWORD $setup
          if ($LASTEXITCODE -ne 0) { throw "Installer Authenticode signing failed." }

          & $env:SIGNTOOL verify /pa /all (Join-Path $env:PACKAGE_DIR "MusicScaleLiveNode.exe")
          if ($LASTEXITCODE -ne 0) { throw "Node signature verification failed." }
          & $env:SIGNTOOL verify /pa /all $setup
          if ($LASTEXITCODE -ne 0) { throw "Installer signature verification failed." }

          $nodeHash = (Get-FileHash (Join-Path $env:PACKAGE_DIR "MusicScaleLiveNode.exe") -Algorithm SHA256).Hash.ToLower()
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          @(
            "$nodeHash  MusicScaleLiveNode.exe"
            "$setupHash  MusicScaleLiveSetup.exe"
          ) | Set-Content (Join-Path $env:PACKAGE_DIR "SHA256SUMS.txt")

          Remove-Item $env:CERT_PATH -Force

      - name: Upload signed Windows release
        uses: actions/upload-artifact@v4
        with:
          name: musicscale-live-node-windows-x64-signed-${{ inputs.version }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS signed and notarized installer
    runs-on: macos-14
    timeout-minutes: 45
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      APPLE_CERT_P12_BASE64: ${{ secrets.MUSICSCALE_LIVE_APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.MUSICSCALE_LIVE_APPLE_CERT_PASSWORD }}
      APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.MUSICSCALE_LIVE_APPLE_DEVELOPER_ID_APPLICATION }}
      APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.MUSICSCALE_LIVE_APPLE_DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.MUSICSCALE_LIVE_APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.MUSICSCALE_LIVE_APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.MUSICSCALE_LIVE_APPLE_APP_PASSWORD }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require Apple signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_CERT_P12_BASE64 APPLE_CERT_PASSWORD APPLE_DEVELOPER_ID_APPLICATION APPLE_DEVELOPER_ID_INSTALLER APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is required for a public signed release."
              exit 1
            fi
          done

      - name: Install and certify source
        run: |
          npm install --no-audit --no-fund
          npm run check:brand
          npm run typecheck
          npm test

      - name: Build PWA and Node executable
        run: |
          npm run build --workspace=@millionsnest/live-web
          npm run package:sea --workspace=@millionsnest/live-node

      - name: Import Apple signing identities
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/musicscale-live-signing.keychain-db"
          CERT="$RUNNER_TEMP/musicscale-live-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$CERT"

      - name: Build signed macOS pkg
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/pkg-root"
          SCRIPTS="$RUNNER_TEMP/pkg-scripts"
          OUT="$RUNNER_TEMP/musicscale-live-macos"
          APP_DIR="$ROOT/Library/Application Support/MusicScaleLive"
          AGENT_DIR="$ROOT/Library/LaunchAgents"

          mkdir -p "$APP_DIR/web" "$AGENT_DIR" "$SCRIPTS" "$OUT"
          cp packages/live-node/dist/MusicScaleLiveNode "$APP_DIR/MusicScaleLiveNode"
          chmod +x "$APP_DIR/MusicScaleLiveNode"
          cp -R apps/live/dist/. "$APP_DIR/web/"
          cp distribution/macos/pkg/com.millionsnest.musicscale-live-node.plist "$AGENT_DIR/"
          cp distribution/macos/pkg/scripts/postinstall "$SCRIPTS/postinstall"
          chmod +x "$SCRIPTS/postinstall"

          codesign --force --options runtime --timestamp --sign "$APPLE_DEVELOPER_ID_APPLICATION" "$APP_DIR/MusicScaleLiveNode"
          codesign --verify --strict --verbose=2 "$APP_DIR/MusicScaleLiveNode"

          pkgbuild             --root "$ROOT"             --scripts "$SCRIPTS"             --identifier "com.millionsnest.musicscale-live-node"             --version "$RELEASE_VERSION"             "$RUNNER_TEMP/MusicScaleLiveNode-component.pkg"

          productbuild             --sign "$APPLE_DEVELOPER_ID_INSTALLER"             --package "$RUNNER_TEMP/MusicScaleLiveNode-component.pkg"             "$OUT/MusicScaleLive.pkg"

          pkgutil --check-signature "$OUT/MusicScaleLive.pkg"
          echo "PACKAGE_DIR=$OUT" >> "$GITHUB_ENV"

      - name: Notarize and staple macOS pkg
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool submit "$PACKAGE_DIR/MusicScaleLive.pkg"             --apple-id "$APPLE_ID"             --password "$APPLE_APP_PASSWORD"             --team-id "$APPLE_TEAM_ID"             --wait
          xcrun stapler staple "$PACKAGE_DIR/MusicScaleLive.pkg"
          xcrun stapler validate "$PACKAGE_DIR/MusicScaleLive.pkg"
          shasum -a 256 "$PACKAGE_DIR/MusicScaleLive.pkg" > "$PACKAGE_DIR/SHA256SUMS.txt"

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Upload signed macOS release
        uses: actions/upload-artifact@v4
        with:
          name: musicscale-live-node-macos-arm64-signed-${{ inputs.version }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 30
