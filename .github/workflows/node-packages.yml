name: Build MusicScale Live Node beta packages

on:
  workflow_dispatch:
  push:
    branches: [production]
  pull_request:
    branches: [main]
    paths:
      - 'packages/live-node/**'
      - 'apps/live/**'
      - 'distribution/**'
      - 'package.json'
      - '.github/workflows/node-packages.yml'

permissions:
  contents: read

env:
  LIVE_NODE_VERSION: 0.1.0-beta.1

concurrency:
  group: musicscale-live-node-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: musicscale-live-node-windows-x64
          - name: macOS arm64
            os: macos-14
            artifact: musicscale-live-node-macos-arm64
          - name: Linux x64
            os: ubuntu-latest
            artifact: musicscale-live-node-linux-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Brand contract
        run: npm run check:brand

      - name: UI accessibility contract
        run: npm run check:ui

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and contract tests
        run: npm test

      - name: Build Live PWA
        run: npm run build --workspace=@millionsnest/live-web

      - name: Build single-executable Live Node
        run: npm run package:sea --workspace=@millionsnest/live-node

      - name: Stage Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "musicscale-live-node"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $out "web") | Out-Null
          Copy-Item "packages/live-node/dist/MusicScaleLiveNode.exe" (Join-Path $out "MusicScaleLiveNode.exe") -Force
          Copy-Item "apps/live/dist/*" (Join-Path $out "web") -Recurse -Force
          Copy-Item "distribution/windows/install.ps1" (Join-Path $out "install.ps1") -Force
          Copy-Item "distribution/windows/INSTALAR-MUSICSCALE-LIVE.cmd" (Join-Path $out "INSTALAR-MUSICSCALE-LIVE.cmd") -Force
          Copy-Item "distribution/windows/uninstall.ps1" (Join-Path $out "uninstall.ps1") -Force
          Copy-Item "distribution/README-INSTALL.md" (Join-Path $out "README-INSTALL.md") -Force
          $hash = (Get-FileHash (Join-Path $out "MusicScaleLiveNode.exe") -Algorithm SHA256).Hash.ToLower()
          "$hash  MusicScaleLiveNode.exe" | Set-Content (Join-Path $out "SHA256SUMS.txt")
          "PACKAGE_DIR=$out" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows one-click installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          & $iscc "/DSourceDir=$env:PACKAGE_DIR" "/DOutputDir=$env:PACKAGE_DIR" "/DAppVersion=$env:LIVE_NODE_VERSION" "distribution/windows/MusicScaleLiveNode.iss"
          $setup = Join-Path $env:PACKAGE_DIR "MusicScaleLiveSetup.exe"
          if (-not (Test-Path $setup)) {
            throw "MusicScaleLiveSetup.exe was not created."
          }
          $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path (Join-Path $env:PACKAGE_DIR "SHA256SUMS.txt") -Value "$setupHash  MusicScaleLiveSetup.exe"

      - name: Stage Unix package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/musicscale-live-node"
          mkdir -p "$out/web"
          cp packages/live-node/dist/MusicScaleLiveNode "$out/MusicScaleLiveNode"
          chmod +x "$out/MusicScaleLiveNode"
          cp -R apps/live/dist/. "$out/web/"
          cp distribution/README-INSTALL.md "$out/README-INSTALL.md"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp distribution/macos/install.command "$out/install.command"
            cp distribution/macos/uninstall.command "$out/uninstall.command"
            chmod +x "$out/install.command" "$out/uninstall.command"

            root="$RUNNER_TEMP/pkg-root"
            scripts="$RUNNER_TEMP/pkg-scripts"
            app_dir="$root/Library/Application Support/MusicScaleLive"
            agent_dir="$root/Library/LaunchAgents"
            mkdir -p "$app_dir/web" "$agent_dir" "$scripts"
            cp "$out/MusicScaleLiveNode" "$app_dir/MusicScaleLiveNode"
            cp -R "$out/web/." "$app_dir/web/"
            cp distribution/macos/pkg/com.millionsnest.musicscale-live-node.plist "$agent_dir/"
            cp distribution/macos/pkg/scripts/postinstall "$scripts/postinstall"
            chmod +x "$app_dir/MusicScaleLiveNode" "$scripts/postinstall"
            pkgbuild               --root "$root"               --scripts "$scripts"               --identifier "com.millionsnest.musicscale-live-node"               --version "$LIVE_NODE_VERSION"               "$out/MusicScaleLiveNode.pkg"
          else
            cp distribution/linux/install.sh "$out/install.sh"
            cp distribution/linux/uninstall.sh "$out/uninstall.sh"
            chmod +x "$out/install.sh" "$out/uninstall.sh"
          fi

          (
            cd "$out"
            shasum -a 256 MusicScaleLiveNode > SHA256SUMS.txt
          )
          echo "PACKAGE_DIR=$out" >> "$GITHUB_ENV"

      - name: Smoke executable
        shell: bash
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          "$PACKAGE_DIR/MusicScaleLiveNode" --help >/tmp/musicscale-live-node-smoke.log 2>&1 &
          pid=$!
          sleep 2
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/musicscale-live-node-smoke.log
            exit 1
          fi
          kill "$pid" || true

      - name: Smoke executable on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath (Join-Path $env:PACKAGE_DIR "MusicScaleLiveNode.exe") -PassThru
          Start-Sleep -Seconds 2
          if ($proc.HasExited) {
            throw "MusicScale Live Node exited during smoke startup."
          }
          Stop-Process -Id $proc.Id -Force

      - name: Upload beta test package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.LIVE_NODE_VERSION }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error
          retention-days: 14
