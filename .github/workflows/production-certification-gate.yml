name: MusicScale Live Production Certification Gate

on:
  pull_request:
    branches: [production]
    paths:
      - "docs/certification/production-certification.json"
      - "scripts/check-production-certification.mjs"
      - "package.json"
      - "packages/live-node/src/index.ts"
      - ".github/workflows/production-certification-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musicscale-live-production-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Verify release contract
        run: npm run check:release

      - name: Require real physical/signing/admin evidence
        run: npm run check:production-certification
